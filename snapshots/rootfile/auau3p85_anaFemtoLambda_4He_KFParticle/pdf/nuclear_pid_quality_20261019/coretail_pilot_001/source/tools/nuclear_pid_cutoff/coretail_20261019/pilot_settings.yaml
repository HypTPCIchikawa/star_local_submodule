tailSpecies:
  d: [d, t]
  t: [d, t]
  he4: [he3, he4]
profiles:
  gaussian_control: {fraction: 0.0, offsetSeedSigma: 0.0, widthRatio: 1.0}
  symmetric_tail: {fraction: 0.1, offsetSeedSigma: 0.0, widthRatio: 1.7}
  positive_tail: {fraction: 0.1, offsetSeedSigma: 0.8, widthRatio: 1.7}
  negative_tail: {fraction: 0.1, offsetSeedSigma: -0.8, widthRatio: 1.7}
adapter: tools/nuclear_pid_cutoff/coretail_20261019/FitCoreTailPilot.C
adapterDependency: tools/nuclear_pid_cutoff/FitLocalNuclearCutoff.C
engine: tools/nuclear_pid_cutoff/coretail_20261019/NuclearCoreTailFitCommon.h
engineDependencies:
  - tools/nuclear_pid_tof/NuclearFitCommon.h
  - tools/nuclear_pid_tof/NuclearLognormalFitCommon.h
executionTimeoutSeconds: 1200
axisTolerance: 0.000000001
parityRelativeTolerance: 0.00000001
