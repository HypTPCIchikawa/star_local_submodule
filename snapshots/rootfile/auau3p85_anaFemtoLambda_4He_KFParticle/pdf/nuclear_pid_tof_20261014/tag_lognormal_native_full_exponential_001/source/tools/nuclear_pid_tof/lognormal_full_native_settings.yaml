  componentWindowWeight: 1.0
  backgroundWindowWeight: 2.0
  nuisanceMode: legacy_fixed_reference
  fitWindowSigmaHalfWidth: 4.0
  fitWindowAlignmentKeV: 0.5
numeric:
  amplitudeMaxIterations: 1000
  amplitudeGradientTolerance: 0.000001
