  amplitudeLineSearchIterations: 80
  shapeMaxCalls: 6000
  shapeTolerance: 0.001
  minimumSigma: 0.05
  maximumSigma: 120.0
  meanAxisPadding: 120.0
  minimumMode: 0.001
