  smoothingNeighbours: 9
  minimumSmoothingNeighbours: 5
  varianceUnfoldIterations: 2
allFit:
  maxNSigma: 2.0
  minimumPurityDenominator: 0.000000001
  maximumConditionalChi2Ndf: 10.0
  sampleHistogram: ALL
  backgroundStartSlope: 0.0
