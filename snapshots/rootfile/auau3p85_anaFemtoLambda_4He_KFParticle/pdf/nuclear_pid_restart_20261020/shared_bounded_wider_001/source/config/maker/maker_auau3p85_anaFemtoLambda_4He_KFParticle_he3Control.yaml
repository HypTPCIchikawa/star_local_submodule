# 3.85 GeV He4 with physical He3 and same-pair He4-mass controls.
# Shared across energies; Lambda cuts come only from mainconf kf:.
# Original anaLambdaNuclearId, not the un-debugged split Maker, is the legacy reference.
lambdaEventPolicy: lambda_imp5_compat
lambdaHe3ControlEnabled: true
nuclearSelectionProfile: legacy_nuclearid
lambdaPairMassMode: fixed
lambdaPairMass: 1.115683
# Daughter rapidity mass hypotheses [GeV/c^2]; global-track momentum, not PV momentum.
lambdaDaughterProtonMass: 0.9382720813
lambdaDaughterPionMass: 0.13957039
lambdaSignalMean: 1.11596
lambdaSignalSigma: 0.00296
lambdaSignalNSigma: 3.0
lambdaSidebandOuterFactor: 4.0
mergingFieldTesla: 0.5
mergingRadiusMeters: 1.4
closePairEnabled: false
closePairVetoSameTrack: true
speciesKeys: lambda,he4,he3
species_lambda_builderType: resonance
species_lambda_particleKey: lambda_kf
species_he4_builderType: track
species_he4_particleKey: he4
species_he3_builderType: track
species_he3_particleKey: he3
nChannels: 8
normQMin: 0.5
normQMax: 1.0
cfRebinFactor: 5
cfCent9Min: 0
cfCent9Max: 8

