# Legacy low-rigidity TPC selection; high-rigidity He4 also requires TOF.
# R=|p/q|; TOF mass2 is (m/q)^2, NOT the Z=2 physical mass squared.
nuclearMinNHitsDedx: 15
nuclearMinPt: 0.1
nSigmaFill1D: 1.5
nSigmaExclude: 2.0
maxNSigmaNuclear: 2.0
m2SigmaCut: 1.5
m2_selection: false
minP_M2cut: 0.2
minM2_M2cut: 0.01
maxM2_M2cut: 10.0
# Retained for d/t/3He only when the He4 extension is enabled.
maxPOverQ: 2.5
requireBestSpecies: true
nuclearMassDeuteron: 1.87561
nuclearMassTriton: 2.80892
nuclearMassHe3: 2.80839
nuclearMassHe4: 3.72742
nuclearTofMeanDeuteron: 3.48096
nuclearTofSigmaDeuteron: 0.141458
nuclearTofMeanTriton: 7.76906
nuclearTofSigmaTriton: 0.341755
nuclearTofMeanHe3: 1.92385
nuclearTofSigmaHe3: 0.094
he4HighRigidityTof:
  enabled: true
  thresholdPOverQ: 2.0
  # Initial, tunable window around (3.72742/2)^2 = 3.4734149641.
  mass2Min: 3.0
  mass2Max: 4.0
