# Analysis Information

# from picoDst Summary from FileCatalog
starTag:
  triggerSets: "production_31GeV_fixedTarget_2019"
  stream: "st_physics"
  collision: "Au31"
  year: "year2019"
  productionTag: "P24iy"
  libraryTag: "SL24y"
  filetype: "daq_reco_picoDst"
  filenameFilter: "st_physics"
  filenameNotFilter: "adc"
  storage: "local"

# Dataset Information
dataset:
  collisionSystem: "Au+Au"
  allPicoDstList: "picoDstList/auau31GeV.list"
  runRange:
    min: 19000000
    max: 20000000
  goodRunList: ""
  dataQuality: "production"
  dataFormat: "picoDst"
  
# Analysis Information
# anaName = {system}_{anaId}[_condition]; use YAML alias *anaName for name, jobName, scratchSubdir, outputFileStem.
# baseRunMacro / baseAnaMacro = macro base names (no .C); runMacro is deprecated.
analysis:
  anaName: &anaName "auau31_anaNuclearId"
  name: *anaName
  mode: "fxtmult"
  type: ""
  targetParticle: "Nuclei"
  decayChannel: ""
  workDir: "/star/u/yichikawa/pwg/git_STAR_3/star-analyzer"
  baseRunMacro: "run_anaNuclearId"
  baseAnaMacro: "anaNuclearId"
  jobName: *anaName
  scratchSubdir: *anaName
  outputFileStem: *anaName
  nFiles: all

analyst:
  name: "Yudai Ichikawa"
  institute: "Tohoku University"
  email: "yudai.ichikawa.d3@tohoku.ac.jp"
