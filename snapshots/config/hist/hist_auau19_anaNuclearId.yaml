# StNuclearIdMaker histogram definitions

axes:
  P: &P
    nBins: 600
    min: 0.0
    max: 6.0
  dEdx: &dEdx
    nBins: 1200
    min: 0.0
    max: 120.0
  Eta: &Eta
    nBins: 100
    min: -3.0
    max: 3.0
  Rapidity: &Rapidity
    nBins: 100
    min: -3.0
    max: 3.0
  Pt: &Pt
    nBins: 600
    min: 0.0
    max: 6.0
  M2: &M2
    nBins: 1000
    min: -0.5
    max: 25.0

histograms:
  hDedxP:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_cut:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_e:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_pi:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_K:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_p:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_else:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_d:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_t:
    xAxis: *P
    yAxis: *dEdx
    title: "TPC dE/dx vs p; p (GeV/c); dE/dx (keV/cm)"
  hDedxP_3He:
