# Explicit legacy downstream conventions; not PicoDst selection cuts.
mass_fit:
  range: [1.08, 1.15]
  mean_limits: [1.11, 1.12]
  sigma_limits: [0.001, 0.008]
  sigma_initial: 0.003
  minimum_entries: 10
  minimum_covariance_status: 2
rebin_group: 4
rebin_fine: 4
plot_x_range: [0.0, 0.3]
purity_rebin: 10
normalization: [0.3, 0.4]
sliding_half_width: 2
ll_fit:
  range: [0.0, 0.4]
  radius_limits: [0.1, 6.0]
  radius_initial: 3.0
  normalization_initial: 1.0
  fixed_a0: 4.01
  fixed_reff: 1.84
group_sets:
  - [{label: '20-80%', min: 0, max: 5}, {label: '0-20%', min: 6, max: 8}]
  - [{label: '0-10%', min: 7, max: 8}, {label: '10-20%', min: 6, max: 6}, {label: '20-60%', min: 2, max: 5}]
