# Postprocessing only; does not change the production event/pair cuts.
summary_settings: summary_settings.yaml
cent9_min: 7
cent9_max: 8
centrality_label: '0-10%'
mass_region: signal
n_slices: 4
split_kstar: [0.0, 0.3]
split_strategy: nearest_se_signal_quantiles_at_saved_mt_edges
# All populated regular mT bins, including sidebands and ME, are retained.
# Flow contents are audited separately and are never silently reassigned.
mt_extent: occupied_regular_bins_all_channels
